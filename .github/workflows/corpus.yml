name: Corpus (real repositories)

# Runs the engines against real, SHA-pinned repositories and asserts invariants that must hold on
# ANY codebase. This is the automation of the one technique that has actually found this project's
# bugs: every serious defect so far — a vendored tree ranked as a hotspot, answers served from a
# containing repo, a dead graph engine, a language server error returned as an answer — was found
# by pointing the tool at an unfamiliar repository, and never by the unit suite, whose fixtures are
# all synthetic two-to-five-file micro-repos.
#
# NIGHTLY, not per-PR, and deliberately so. It clones over the network and takes minutes; wired
# into every push it would be the check people learn to ignore, and a corpus job that gets
# rubber-stamped is worth less than none. A nightly failure is a real signal worth reading.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:        # and on demand, e.g. before cutting a release

jobs:
  corpus:
    name: Corpus invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .[dev]

      # Pinned for the same reason the graph-contract job pins it: 0.10.x changed the response
      # format and returns nothing for every op but resolution.
      - name: Install the pinned graph backend
        run: pip install 'codebase-memory-mcp==0.9.*'

      - name: Warm the backend runtime
        run: codebase-memory-mcp --version

      # Cloned repos are keyed by the SHAs in tests/test_corpus.py, so the cache is invalidated
      # exactly when the corpus changes.
      - name: Cache the corpus checkouts
        uses: actions/cache@v6
        with:
          path: /tmp/codeintel-corpus
          key: corpus-${{ hashFiles('tests/test_corpus.py') }}

      # `-o addopts=` drops the project-wide coverage floor: this job runs one file and would
      # otherwise fail for a reason unrelated to any invariant. `-rs` prints skip reasons, because
      # a silently skipped corpus check is the failure mode this whole job exists to prevent.
      - name: Corpus invariants
        env:
          CODEINTEL_CORPUS: "1"
          # `CODEINTEL_ENABLE_UNVERIFIED_OPS` used to be exported here so the nightly oracle could
          # measure `deadcode` while it was withdrawn from the default surface. That measurement has
          # happened (`test_deadcode_precision_and_recall_are_measured_not_assumed`) and retired the
          # op, so the flag now enables nothing and exporting it would imply otherwise.
        run: pytest tests/test_corpus.py -v -rs -o addopts=

  # The call-edge benchmark's release gate (`bench/run.py`, verified-caller direct precision >= 95%,
  # per repository, never pooled). It used to run only when someone ran it by hand, so the floor
  # was a number the README quoted rather than one anything checked. Nightly for the reason above:
  # it clones and indexes real repositories.
  #
  # Each repository is pinned to a SHA so a night's verdict changes only when codeintel or the
  # backend does: the oracle recomputes truth from the tree, but the target list in `bench/run.py`
  # names files and symbols, and a moving HEAD would turn a renamed file into a harness failure.
  # Bump a SHA deliberately, together with the targets. `snitch-simulator` is not here because its repository is not public; `corpus-ts` is a
  # smoke fixture the gate exempts by design.
  bench-gate:
    name: Call-edge benchmark gate (${{ matrix.repo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: pathly-adapters
            url: https://github.com/hamilton-sky/pathly-adapters
            sha: 98185757d6cba9819f1fe65bb8a0ebc67569465c
          - repo: daycap
            url: https://github.com/hamilton-sky/daycap
            sha: 71502b896af0eb3057ff11ef55dfa1f7c45074b2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Install the pinned graph backend
        run: pip install 'codebase-memory-mcp==0.9.*'

      - name: Warm the backend runtime
        run: codebase-memory-mcp --version

      - name: Check out ${{ matrix.repo }} at its pinned SHA
        run: |
          git init -q /tmp/bench/${{ matrix.repo }}
          git -C /tmp/bench/${{ matrix.repo }} fetch -q --depth 1 ${{ matrix.url }} ${{ matrix.sha }}
          git -C /tmp/bench/${{ matrix.repo }} checkout -q FETCH_HEAD

      - name: Index it
        run: codeintel index /tmp/bench/${{ matrix.repo }}

      # Exit 1 is the gate failing (or the arm being unmeasurable); exit 2 is the harness not
      # running at all. Both fail the job, and the full table is in the log either way.
      - name: Run the benchmark (the exit code is the gate)
        env:
          CODEINTEL_BENCH_PATHLY: /tmp/bench/pathly-adapters
          CODEINTEL_BENCH_DAYCAP: /tmp/bench/daycap
        run: python bench/run.py ${{ matrix.repo }}
