name: CI

on:
  push:
  pull_request:

jobs:
  # Fast static gate. Split from `test` so a lint or typing regression is one obvious red check
  # rather than a failure buried in a matrix leg, and so it reports in seconds.
  # ruff and mypy are SEPARATE JOBS, for the reason release-consistency below is separate — and
  # because this file already stated that principle and then did the opposite here. They shared one
  # job; steps in a job are fail-fast; ruff went red and mypy therefore did not run for an entire
  # stretch of work. What was hiding behind it: both "did a backend call fail?" checks in
  # graph.build_result had become UNREACHABLE to a type checker, so the code that stops a dead
  # backend being reported as an absence in the user's repository was, formally, dead. A blocking
  # gate that silently does not run is worse than no gate, because the green tick still appears
  # next to every other job. One gate, one job, one red line that names which gate failed.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: ruff
        run: ruff check src tests

  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .[dev]

      # Checks src/ only: the config is deliberately not --strict, because the provider seams
      # cross into untyped backends where demanding annotations buys noise rather than safety.
      - name: mypy
        run: mypy

  # Its own check for the same reason lint is split from test: a version that was documented but
  # never tagged is a specific, actionable mistake, and it should read as one red line rather than
  # hide inside another job. Needs full history + tags, which the other jobs deliberately skip.
  release-consistency:
    name: Release consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # No dependencies: the script parses __version__ with ast and shells out to `git tag`.
      - name: Every documented version is tagged
        run: python scripts/check_release_consistency.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e .[dev]

      # The live graph/LSP tests skip when their backends (codebase-memory-mcp, uvx/serena) are
      # absent, so CI stays green without them; everything else runs against real seams/fixtures.
      # The coverage floor lives in pyproject's addopts, so it applies identically here and locally.
      - name: Run tests
        run: pytest tests/ -q

  # The graph engine's real wire contract. Everything else in this file validates the graph
  # provider against hand-authored mocks, which assert what codeintel INTENDS to send — worthless
  # when the intent is wrong, as the 0.13.1 → 0.13.2 pair already demonstrated.
  #
  # This job exists because the backend being absent from CI hid a total outage: codebase-memory-mcp
  # 0.10.x replaced the `{columns, rows}` JSON payload with a text format while KEEPING
  # list_projects as JSON, so project resolution and `doctor` went on reporting a healthy engine
  # while every actual query returned nothing and the tool said "not in the graph index" about a
  # fully indexed repository. The one live test that would have caught it skipped instead — on a
  # condition that same bug produced.
  graph-contract:
    name: Graph backend contract (live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .[dev]

      # PINNED, and pinned narrowly. This backend self-updates and has changed its response format
      # within a minor release; an unpinned install silently re-breaks every graph op. When raising
      # this, run the live tests locally first — they are the only thing that checks the format.
      - name: Install the pinned graph backend
        run: pip install 'codebase-memory-mcp==0.9.*'

      # First invocation downloads a platform-specific native runtime and verifies its checksum.
      # Doing it as its own step keeps that cost (and any failure) out of the test output.
      - name: Warm the backend runtime
        run: codebase-memory-mcp --version

      # `-o addopts=` drops the coverage floor from pyproject: this job runs one file, so the
      # project-wide threshold would fail it for reasons that have nothing to do with the contract.
      # `-rs` prints skip reasons — a skip here means the contract went unchecked, which is the
      # failure mode that let this ship, so it must be visible in the log.
      - name: Live graph contract tests
        run: pytest tests/test_graph_real.py tests/test_graph_stdin.py -v -rs -o addopts=

      # A skip is not a pass. If the backend is installed and the repo is indexed, these tests must
      # actually run; anything else means the contract was not exercised.
      - name: Fail if the contract tests were skipped
        run: |
          pytest tests/test_graph_stdin.py -q -rs -o addopts= 2>&1 | tee /tmp/graph.log
          if grep -qE "^SKIPPED|[0-9]+ skipped" /tmp/graph.log; then
            echo "::error::live graph tests skipped — the backend contract went unverified"
            exit 1
          fi

  # The LSP engine's real contract — the same blind spot as graph, one engine over.
  #
  # This job is why it exists: the live LSP test had never run anywhere, and the first execution
  # showed the provider handing serena's ERROR TEXT back as a successful answer — `ok: true`, no
  # `reason`, and a body containing a dump of the LSP init params plus instructions addressed to a
  # language model ("Inform the user and wait for further instructions before you continue!").
  # A backend's error path had a direct line into what the calling agent reads as data.
  #
  # Kept separate from graph-contract so a serena regression and a codebase-memory-mcp regression
  # are two distinct red checks, and `continue-on-error` because serena is fetched from a git HEAD
  # that this project does not control — an upstream breakage must be visible without blocking an
  # unrelated release. Read this job's status; do not assume green means checked.
  lsp-contract:
    name: LSP backend contract (live)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Install uv (provides uvx, which fetches serena)
        run: pip install uv

      # First launch pulls serena from GitHub and can take tens of seconds; doing it here keeps
      # that cost and any upstream fetch failure out of the test output.
      - name: Warm serena
        run: uvx --from git+https://github.com/oraios/serena serena --help

      - name: Live LSP contract tests
        env:
          CODEINTEL_LIVE_LSP: "1"
        run: pytest tests/test_lsp_real.py -v -rs -o addopts=

      # Call #1 in a PRISTINE process, not call #2 in this job's already-warmed one. See
      # tests/test_cold_process.py's module docstring: B1 (docs/eval-2026-08-17.md:65-103) was a
      # cold LSP session that timed out on the very first call of a fresh process and rendered the
      # resulting empty reference list as a confident "(none)" — a shape no test above this line
      # can express, because every one of them runs inside an interpreter (or, for the live tests,
      # a job) that has already warmed something. Reuses this job's already-warmed uvx above.
      - name: Cold-process tier (call #1 in a pristine process)
        env:
          CODEINTEL_LIVE_LSP: "1"
          CODEINTEL_COLD_PROCESS: "1"
        run: |
          pytest tests/test_cold_process.py -v -rs -o addopts= 2>&1 | tee /tmp/cold.log
          if grep -qE "^SKIPPED|[0-9]+ skipped" /tmp/cold.log; then
            echo "::error::cold-process tests skipped — the first-call defect class went unverified"
            exit 1
          fi

  build:
    name: Build + verify the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install the wheel in a clean env
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install dist/*.whl

      # fastembed downloads the embedding model on first use. Cached so the canary costs one
      # network fetch per model change rather than one per run; a miss only makes it slower.
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: /tmp/fastembed-cache
          key: fastembed-bge-small-en-v1.5

      # The real release gate. `codeintel status`/`query` are never-raise and always exit 0, and
      # every MCP result is a safe envelope with ok:true — so an exit-code smoke test passes
      # against a completely inert build. The canary installs into a throwaway HOME, registers
      # Codex + Claude Code, launches the command those configs name, and asserts on the ANSWER
      # text of a real code.query against a fixture repo. Verified to go red on both a config
      # written where the host does not read it and a server that answers ok:true with nothing.
      - name: Release canary against the built artifact
        env:
          FASTEMBED_CACHE_PATH: /tmp/fastembed-cache
        run: /tmp/verify/bin/python scripts/release_canary.py

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
