name: Publish to PyPI

# Publishes codecortex to PyPI when a version tag (v*) is pushed.
#
# Uses PyPI Trusted Publishing (OIDC) — NO API token is stored in the repo. Before the first
# release, configure a trusted publisher on PyPI for the `codecortex` project:
#   PyPI → your project → Publishing → Add a trusted publisher (GitHub Actions)
#     owner:       hamilton-sky
#     repository:  codeintel
#     workflow:    publish.yml
#     environment: pypi
# Then tag a green commit:  git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Build + publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install the wheel in a clean env
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install dist/*.whl

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: /tmp/fastembed-cache
          key: fastembed-bge-small-en-v1.5

      # Last gate before an irreversible publish. `twine check` validates METADATA — it never
      # launches the thing. The canary registers the wheel with Codex + Claude Code in a throwaway
      # HOME, starts the command those configs name, and asserts on the answer text of a real
      # code.query. A release that installs into a file no host reads, or boots and answers
      # nothing, fails HERE rather than on a user's machine.
      - name: Release canary against the built artifact
        env:
          FASTEMBED_CACHE_PATH: /tmp/fastembed-cache
        run: /tmp/verify/bin/python scripts/release_canary.py

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
