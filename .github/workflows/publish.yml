name: Publish to PyPI

# Publishes codecortex to PyPI when a version tag (v*) is pushed.
#
# Uses PyPI Trusted Publishing (OIDC) — NO API token is stored in the repo. Before the first
# release, configure a trusted publisher on PyPI for the `codecortex` project:
#   PyPI → your project → Publishing → Add a trusted publisher (GitHub Actions)
#     owner:       hamilton-sky
#     repository:  codeintel
#     workflow:    publish.yml
#     environment: pypi
# Then tag a green commit:  git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Build + publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # FIRST, before anything is built. Tagging without bumping `__version__` produces a wheel
      # labelled with the PREVIOUS version, which PyPI then rejects as a duplicate — several
      # minutes in, with an error ("File already exists") that names neither the tag nor the
      # mismatch. Real occurrence: v0.15.3 was pushed while `__version__` still read 0.15.2.
      # Failing here costs seconds and says exactly what is wrong.
      - name: The tag must match __version__
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import ast,pathlib;
src=pathlib.Path('src/codeintel/__init__.py').read_text()
print([ast.literal_eval(n.value) for n in ast.parse(src).body
       if isinstance(n, ast.Assign) and getattr(n.targets[0], 'id', '') == '__version__'][0])")
          echo "tag=$TAG  __version__=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match __version__ ($VERSION). Bump __version__ and"
            echo "::error::the CHANGELOG, move the tag to that commit, and push again."
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section — a release with no entry"
            echo "::error::is how three earlier versions went out undocumented."
            exit 1
          fi

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install the wheel in a clean env
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install dist/*.whl

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: /tmp/fastembed-cache
          key: fastembed-bge-small-en-v1.5

      # Last gate before an irreversible publish. `twine check` validates METADATA — it never
      # launches the thing. The canary registers the wheel with Codex + Claude Code in a throwaway
      # HOME, starts the command those configs name, and asserts on the answer text of a real
      # code.query. A release that installs into a file no host reads, or boots and answers
      # nothing, fails HERE rather than on a user's machine.
      - name: Release canary against the built artifact
        env:
          FASTEMBED_CACHE_PATH: /tmp/fastembed-cache
        run: /tmp/verify/bin/python scripts/release_canary.py

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
